# =============================================================================
#  CI/CD — EcoTrack API (Cidades ESG Inteligentes)
#
#  build  ->  test  ->  docker (build + push GHCR)  ->  deploy staging  ->  deploy produção
#
#  - pull_request para main ......... build + testes (CI)
#  - push em develop ................ CI + imagem + deploy em STAGING
#  - push em main / manual .......... CI + imagem + STAGING + PRODUÇÃO
#    (produção só roda se staging passar; pode exigir aprovação manual
#     configurando "Required reviewers" no environment "production")
# =============================================================================
name: CI/CD - EcoTrack API

on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EcoTrackNet.sln

      - name: Build (Release)
        run: dotnet build EcoTrackNet.sln -c Release --no-restore

      - name: Publish da API
        run: dotnet publish src/EcoTrack.API/EcoTrack.API.csproj -c Release --no-build -o out/api

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: ecotrack-api-build
          path: out/api
          retention-days: 7

  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Testes automatizados
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Executar testes (xUnit + cobertura)
        run: >
          dotnet test EcoTrackNet.sln -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Anotar testes que falharam
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed":
                      continue
                  msg = r.findtext(".//t:Message", default="", namespaces=ns)
                  st = r.findtext(".//t:StackTrace", default="", namespaces=ns)
                  text = (msg + " | " + st).replace("\r", " ").replace("\n", " ")[:900]
                  print(f"::error title=Teste falhou: {r.get('testName')}::{text}")

      - name: Relatório de testes
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Resultado dos testes xUnit
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Resumo dos testes
        if: always()
        shell: bash
        run: |
          TRX=$(find TestResults -name '*.trx' | head -1)
          if [[ -n "$TRX" ]]; then
            total=$(grep -o 'total="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
            passed=$(grep -o 'passed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
            failed=$(grep -o 'failed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
            {
              echo "## 🧪 Testes automatizados"
              echo "| Total | ✅ Passaram | ❌ Falharam |"
              echo "|---|---|---|"
              echo "| $total | $passed | $failed |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dos resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # ---------------------------------------------------------------------------
  docker:
    name: 🐳 Docker build & push (GHCR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      image_repo: ${{ steps.vars.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem
        id: vars
        shell: bash
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "image=$REPO:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_repo }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo da imagem
        run: |
          {
            echo "## 🐳 Imagem Docker publicada"
            echo "\`${{ steps.vars.outputs.image }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy-staging:
    name: 🚀 Deploy STAGING
    needs: docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}
      image_repo: ${{ needs.docker.outputs.image_repo }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  deploy-production:
    name: 🏭 Deploy PRODUÇÃO
    needs: [docker, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}
      image_repo: ${{ needs.docker.outputs.image_repo }}
    secrets: inherit
